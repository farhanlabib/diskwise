name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: packages/native-helper/build.sh
      - run: pnpm -F @macsweep/ui build
      - run: pnpm -F macsweep build
      - name: Verify the helper is ad-hoc signed
        run: codesign -dv packages/cli/dist/macsweep-helper 2>&1 | grep -q 'Signature=adhoc'
      - name: Checksum the native helper
        run: shasum -a 256 packages/cli/dist/macsweep-helper > macsweep-helper.sha256
      - name: Publish to npm
        run: cd packages/cli && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create the GitHub release
        run: gh release create ${{ github.ref_name }} macsweep-helper.sha256 --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
