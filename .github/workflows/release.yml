name: Release

# Release chain: a version bump merged to main is what publishes. This
# workflow runs on two triggers and shares one build-and-publish job:
#   - push to main: releases only when packages/cli's version has no matching
#     vX.Y.Z tag yet (otherwise prints "nothing to release" and exits 0). The
#     whole build-and-publish happens in this same run — the tag is created
#     via the API only after npm publish succeeds, because a tag pushed with
#     the workflow's own GITHUB_TOKEN cannot trigger another workflow run.
#   - push of a vX.Y.Z tag (cut by hand): the same build-and-publish, with
#     the tag-matches-version guard.
# Merges to main without a version bump publish nothing; CI covers them via
# .github/workflows/ci.yml. .github/workflows/release-prepare.yml opens the
# version-bump pull request.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  decide:
    name: Decide whether to release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_tag: ${{ steps.decide.outputs.is_tag }}
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # This job only reads the version and the tag list.
          package-manager-cache: false
      - id: decide
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/cli/package.json').version")"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = "tag" ]; then
            # Tag path only: the pushed tag must match the CLI package version.
            if [ "$REF_NAME" != "$tag" ]; then
              echo "error: tag $REF_NAME does not match packages/cli version $version (expected $tag)" >&2
              exit 1
            fi
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
            release=true
          else
            # Main path only: release when the version has no tag yet.
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              release=false
              echo "nothing to release: tag $tag already exists"
            else
              release=true
              echo "tag $tag does not exist yet - releasing"
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          # Fail here rather than after the ~25 minute helper build.
          if [ "$release" = "true" ] && [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::No npm credentials, so this release cannot publish. Add the NPM_TOKEN repository secret, or configure npm trusted publishing for this repository and remove this check."
            exit 1
          fi

  release:
    name: Publish
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # npm refuses to publish over an existing version, so catch that here
      # instead of after the ~25 minute native helper build.
      - name: Fail early if this version is already on npm
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if npm view "diskwise@$version" version >/dev/null 2>&1; then
            echo "error: diskwise@$version is already published. Bump packages/cli/package.json (and packages/cli/src/version.ts) to a new version, then release that." >&2
            exit 1
          fi
          echo "diskwise@$version is not on npm yet - proceeding"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the universal native helper
        run: DISKWISE_HELPER_RELEASE=1 packages/native-helper/build.sh
        timeout-minutes: 25
      - run: pnpm -F @diskwise/ui build
      - run: pnpm -F diskwise build

      - name: Verify the helper is a universal binary
        run: |
          archs="$(lipo -archs packages/cli/dist/diskwise-helper)"
          echo "$archs"
          echo "$archs" | grep -qw arm64
          echo "$archs" | grep -qw x86_64
      - name: Verify the helper is ad-hoc signed
        run: codesign -dv packages/cli/dist/diskwise-helper 2>&1 | grep -q 'Signature=adhoc'
      - name: Checksum the native helper
        run: shasum -a 256 packages/cli/dist/diskwise-helper > diskwise-helper.sha256

      - name: Pack the tarball, verify its helper and smoke-test it standalone
        run: scripts/smoke-packed-tarball.sh
        timeout-minutes: 15

      - name: Publish to npm
        run: cd packages/cli && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Main path only: cut the tag after the publish succeeded. Creating it
      # via the API on purpose — a git push with GITHUB_TOKEN would not start
      # another run anyway, and the release above already happened here.
      - name: Create the tag
        if: needs.decide.outputs.is_tag == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/git/refs" \
            -f "ref=refs/tags/${{ needs.decide.outputs.tag }}" \
            -f "sha=$GITHUB_SHA"

      - name: Create the GitHub release
        run: gh release create "${{ needs.decide.outputs.tag }}" diskwise-helper.sha256 --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update the Homebrew tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAP_REPOSITORY: ${{ vars.TAP_REPOSITORY }}
        run: |
          if [ -z "${TAP_GITHUB_TOKEN:-}" ]; then
            echo "warning: TAP_GITHUB_TOKEN is not set — skipping the Homebrew tap update."
            echo "To enable it, create the tap repository and add the TAP_GITHUB_TOKEN repository secret; see packaging/README.md."
          else
            scripts/update-homebrew-tap.sh "${{ needs.decide.outputs.tag }}"
          fi
