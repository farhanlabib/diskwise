name: Graphify

# Documented in docs/graphify.md. No GitHub-integration product named "graphify"
# exists, so this is the documented equivalent: it regenerates the package
# dependency graph (docs/package-graph.md), uploads it as a build artifact, and
# fails pull requests whose committed graph is stale. It never pushes: main is
# branch-protected, so a workflow push would be rejected.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/**'
      - '.github/workflows/graphify.yml'
      - '.github/scripts/generate-package-graph.mjs'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graph:
    name: Package graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Generate package graph
        run: node .github/scripts/generate-package-graph.mjs

      - name: Upload graph artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-graph
          path: docs/package-graph.md

      - name: Check the committed graph is fresh
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- docs/package-graph.md)" ]; then
            echo "docs/package-graph.md is up to date"
            exit 0
          fi
          echo "::error::docs/package-graph.md is stale. Run 'node .github/scripts/generate-package-graph.mjs' and commit the result."
          exit 1
