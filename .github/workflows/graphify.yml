name: Graphify

# Documented in docs/graphify.md. No GitHub-integration product named "graphify"
# exists, so this is the documented equivalent: it regenerates the package
# dependency graph (docs/package-graph.md), uploads it as a build artifact, and
# on main commits the file back when it changed.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/**'
      - '.github/workflows/graphify.yml'
      - '.github/scripts/generate-package-graph.mjs'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graph:
    name: Package graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: write is only exercised by the commit-back step on main; GitHub
    # clamps fork pull_request runs to read-only regardless of this setting.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Generate package graph
        run: node .github/scripts/generate-package-graph.mjs

      - name: Upload graph artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-graph
          path: docs/package-graph.md

      - name: Commit refreshed graph
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain -- docs/package-graph.md)" ]; then
            echo "docs/package-graph.md is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/package-graph.md
          git commit -m "docs: refresh package dependency graph"
          git push
