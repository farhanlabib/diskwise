name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # diskwise is macOS-only: the test suite depends on APFS, macOS tools (plutil, mdls,
  # codesign) and macOS path layout, so tests run in the macOS job. This job is a fast
  # lint + typecheck gate.
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: packages/native-helper/build.sh
      - run: pnpm test
      - run: pnpm -F @diskwise/ui build
      - run: pnpm -F diskwise build
      - run: pnpm exec playwright install chromium && pnpm test:e2e
