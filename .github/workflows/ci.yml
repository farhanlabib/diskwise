name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # diskwise is macOS-only: the test suite depends on APFS, macOS tools (plutil, mdls,
  # codesign) and macOS path layout, so tests run in the macOS job. This job is a fast
  # lint + typecheck gate.
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  macos:
    name: macOS (Node ${{ matrix.node }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the universal native helper
        run: DISKWISE_HELPER_RELEASE=1 packages/native-helper/build.sh
        timeout-minutes: 25
      - name: Verify the helper is a universal binary
        run: |
          archs="$(lipo -archs packages/native-helper/bin/diskwise-helper)"
          echo "$archs"
          echo "$archs" | grep -qw arm64
          echo "$archs" | grep -qw x86_64
      - run: pnpm test
      - run: pnpm -F @diskwise/ui build
      - run: pnpm -F diskwise build
      - name: Pack the tarball and smoke-test it standalone
        run: scripts/smoke-packed-tarball.sh
        timeout-minutes: 15
      - run: pnpm exec playwright install chromium && pnpm test:e2e
